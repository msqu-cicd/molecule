# Reusable molecule workflow for Ansible roles (vultr scenario).
# Called from each role's .gitea/workflows/molecule.yml; see README.md for the caller template.
name: Molecule (vultr)

on:
  workflow_call:
    inputs:
      force_run:
        description: Run the tests even if no relevant files changed ('true'/'false')
        type: string
        default: 'false'
      args:
        description: Additional arguments passed to molecule test
        type: string
        default: ''
      molecule_debug:
        description: Open a tmate debugging session before the tests ('true'/'false')
        type: string
        default: 'false'
      distro:
        description: Vultr OS name for the integration job
        type: string
        default: Arch Linux x64
      instance_size:
        description: Server type/plan, empty uses the scenario default
        type: string
        default: ''
      extra_files_ignore:
        description: Additional changed-files ignore patterns, one per line (e.g. 'files/**')
        type: string
        default: ''
      molecule_ref:
        description: Ref of CICD/molecule to take the scenario from
        type: string
        default: main
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      CI_RUNNER_PAT:
        required: true
      CI_RUNNER_PAT_GITHUB:
        required: false
      ANSIBLE_VAULT_PASSWORD:
        required: true
      VULTR_API_KEY:
        required: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      # a push its pull request already tested counts as unchanged: lint and tests skip
      any_modified: ${{ steps.tested.outputs.tested == 'true' && 'false' || steps.changed.outputs.any_modified }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          # the merge commit and its parents
          fetch-depth: 2

      # A merge commit whose tree equals its second parent (the pull request head, up to date with
      # the target branch) or a fast-forward to the head itself adds nothing the pull request run
      # did not test. Any other push, or a failed lookup, runs the tests.
      - name: Detect a push its pull request already tested
        id: tested
        if: github.event_name == 'push'
        env:
          API: https://git.msqu.de/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.CI_RUNNER_PAT }}
        run: |
          tested=false
          candidate=$(git rev-parse HEAD)
          if second=$(git rev-parse -q --verify 'HEAD^2^{commit}'); then
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              candidate=$second
            else
              candidate=
            fi
          fi
          if [ -n "$candidate" ]; then
            # the caller job's status sums up the whole molecule run of the pull request
            state=$(curl -fsS -H "Authorization: token $TOKEN" "$API/commits/$candidate/status" |
              jq -r '[.statuses[]? | select(.context | endswith("/ molecule (pull_request)")) | .status] | first // empty') || state=
            echo "pull request run of $candidate: ${state:-none}"
            if [ "$state" = success ]; then
              tested=true
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      # any_modified also counts deleted files (any_changed does not)
      - id: changed
        if: steps.tested.outputs.tested != 'true'
        uses: https://github.com/tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_ignore: |
            .ansible-lint
            .gitea/**
            .github/**
            .yamllint
            Makefile
            meta/main.yml
            README.md
            renovate.json
            ${{ inputs.extra_files_ignore }}

  lint:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:3603096381eb976ea4d0e25a5a74fdf95686710034e5a024d0fc45fb873b64f2
    needs: changes
    if: needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true'
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Ansible Lint
        run: ansible-lint -c .ansible-lint .

      - name: Yaml Lint
        run: yamllint -f colored .

  # The role's argument specs and asserts against the real infra inventories: every host an infra
  # playbook applies the role to, local connection, no test server (scripts/infra-spec-check.py).
  infra-spec:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:3603096381eb976ea4d0e25a5a74fdf95686710034e5a024d0fc45fb873b64f2
    needs: [changes, lint]
    if: needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true'
    steps:
      # Role code from the change runs in this job: no checkout keeps its token in .git/config
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout infra repository
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: infrastructure/infra
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_infra
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /group_vars/
            /host_vars/
            /inventories/
            /*.yml

      - name: Checkout the check script
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts

      - name: Check the role against the infra inventories
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"
          unset ANSIBLE_VAULT_PASSWORD
          export ANSIBLE_VAULT_PASSWORD_FILE="$GITHUB_WORKSPACE/.vault"
          python3 git_molecule/scripts/infra-spec-check.py "$GITHUB_WORKSPACE" git_infra "${GITHUB_REPOSITORY#*/}"

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *

  molecule-integration:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:3603096381eb976ea4d0e25a5a74fdf95686710034e5a024d0fc45fb873b64f2
    needs: [changes, lint]
    if: (needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true')
    env:
      TEST_TYPE: integration
      VULTR_SERVER_STATE: present
      MOLECULE_DISTRO: ${{ inputs.distro }}
      MOLECULE_SCENARIO_NAME: vultr
      INSTANCE_SIZE: ${{ inputs.instance_size }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo ${GITHUB_REPOSITORY#*/} | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> $GITHUB_ENV

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          # test hosts get new host keys every run; git.msqu.de stays checked against the keyscan above
          cat > ~/.ssh/config << EOF
          Host * !git.msqu.de
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout infra repository
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: infrastructure/infra
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_infra
          ref: main
          sparse-checkout: |
            group_vars/

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          sparse-checkout: |
            scenarios/vultr

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/molecule/default
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/vultr/ \
            ${GITHUB_WORKSPACE}/molecule/default/

      - name: Configure integration test variables
        run: |
          rsync -aP git_infra/group_vars ${GITHUB_WORKSPACE}/molecule/default/

      - name: Setup debugging session
        if: inputs.molecule_debug == 'true'
        uses: https://github.com/mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        with:
          limit-access-to-actor: true
          # tmate, openssh-client and xz-utils come with the runner image
          install-dependencies: false

      - name: Run Molecule integration tests
        # word splitting of MOLECULE_ARGS is intended (multiple molecule CLI arguments)
        run: molecule test $MOLECULE_ARGS
        env:
          MOLECULE_ARGS: ${{ inputs.args }}
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '1'
          CI_JOB_ID: ${{ github.run_id }}
          GITEA_TOKEN: ${{ secrets.CI_RUNNER_PAT }}
          GITHUB_TOKEN: ${{ secrets.CI_RUNNER_PAT_GITHUB }}
          MOLECULE_DEBUG: ${{ inputs.molecule_debug }}
          PY_COLORS: '1'
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *

  # Runs after all test jobs, also after failures and cancellations: deletes leftover servers
  # (and, via the role's cleanup.yml, their DNS records) instead of leaving them stopped.
  # Skips with the tests (nothing relevant changed, or a push its pull request already tested).
  molecule-cleanup:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:3603096381eb976ea4d0e25a5a74fdf95686710034e5a024d0fc45fb873b64f2
    if: always() && (needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true')
    needs: [changes, molecule-integration]
    env:
      MOLECULE_SCENARIO_NAME: vultr
      MOLECULE_DISTRO: ${{ inputs.distro }}
      VULTR_SERVER_STATE: absent
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo ${GITHUB_REPOSITORY#*/} | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> $GITHUB_ENV

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          # test hosts get new host keys every run; git.msqu.de stays checked against the keyscan above
          cat > ~/.ssh/config << EOF
          Host * !git.msqu.de
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          sparse-checkout: |
            scenarios/vultr

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/molecule/default
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/vultr/ \
            ${GITHUB_WORKSPACE}/molecule/default/

      - name: Destroy leftover molecule resources
        continue-on-error: true
        run: molecule destroy || echo "Cleanup failed or no resources to destroy"
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Cleanup orphaned Vultr resources
        continue-on-error: true
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          echo "Checking for orphaned Vultr resources..."
          # Fail loudly if the API cannot be queried instead of reporting "nothing found"
          ALL_INSTANCES=$(vultr-cli instance list --output json)
          INSTANCE_LIST=$(echo "$ALL_INSTANCES" | jq -r '.instances[]? | select(.label == "molecule-'${CI_PROJECT_NAME_MOLECULE}'") | .id')
          if [ -n "$INSTANCE_LIST" ]; then
            echo "Found orphaned instances:"
            echo "$INSTANCE_LIST"
            echo "$INSTANCE_LIST" | while read instance_id; do
              echo "Deleting instance: $instance_id"
              vultr-cli instance delete "$instance_id" || echo "Failed to delete $instance_id"
            done
          else
            echo "No orphaned instances found"
          fi

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *
