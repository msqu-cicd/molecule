# Reusable molecule workflow for Ansible roles (vultr scenario). Pushes to the default branch run
# lint, infra-spec and the secret scan only, so they start no Vultr instance.
# Called from each role's .gitea/workflows/molecule.yml; see README.md for the caller template.
name: Molecule (vultr)

on:
  workflow_call:
    inputs:
      force_run:
        description: Run the tests even if no relevant files changed ('true'/'false')
        type: string
        default: 'false'
      args:
        description: Additional arguments passed to molecule test
        type: string
        default: ''
      molecule_debug:
        description: Open a tmate debugging session before the tests ('true'/'false')
        type: string
        default: 'false'
      distro:
        description: Vultr OS name for the integration job
        type: string
        default: Arch Linux x64
      instance_size:
        description: Server type/plan, empty uses the scenario default
        type: string
        default: ''
      extra_files_ignore:
        description: Additional changed-files ignore patterns, one per line (e.g. 'files/**')
        type: string
        default: ''
      molecule_ref:
        description: Ref of CICD/molecule to take the scenario from
        type: string
        default: main
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      CI_RUNNER_PAT:
        required: true
      CI_RUNNER_PAT_GITHUB:
        required: false
      ANSIBLE_VAULT_PASSWORD:
        required: true
      VULTR_API_KEY:
        required: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      # a push its pull request already tested counts as unchanged: lint and tests skip
      any_modified: ${{ steps.tested.outputs.tested == 'true' && 'false' || steps.changed.outputs.any_modified }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          # the merge commit and its parents
          fetch-depth: 2

      # A merge commit whose tree equals its second parent (the pull request head, up to date with
      # the target branch) or a fast-forward to the head itself adds nothing the pull request run
      # did not test. Any other push, or a failed lookup, runs the tests.
      - name: Detect a push its pull request already tested
        id: tested
        if: github.event_name == 'push'
        env:
          API: https://git.msqu.de/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.CI_RUNNER_PAT }}
        run: |
          tested=false
          candidate=$(git rev-parse HEAD)
          if second=$(git rev-parse -q --verify 'HEAD^2^{commit}'); then
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              candidate=$second
            else
              candidate=
            fi
          fi
          if [ -n "$candidate" ]; then
            # the caller job's status sums up the whole molecule run of the pull request
            state=$(curl -fsS -H "Authorization: token $TOKEN" "$API/commits/$candidate/status" |
              jq -r '[.statuses[]? | select(.context | endswith("/ molecule (pull_request)")) | .status] | first // empty') || state=
            echo "pull request run of $candidate: ${state:-none}"
            if [ "$state" = success ]; then
              tested=true
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      # any_modified also counts deleted files (any_changed does not)
      - id: changed
        if: steps.tested.outputs.tested != 'true'
        uses: https://github.com/tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_ignore: |
            .ansible-lint
            .gitea/**
            .github/**
            .yamllint
            Makefile
            meta/main.yml
            README.md
            renovate.json
            ${{ inputs.extra_files_ignore }}

  lint:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:5b89c9cd73590b5368ee028ae99168809813bab8a4e42381b973a4428d8c94ac
    needs: changes
    if: needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true'
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Ansible Lint
        run: ansible-lint -c .ansible-lint .

      - name: Yaml Lint
        run: yamllint -f colored .

      # Tracked *.sh/*.bash files and extensionless files with a sh/bash shebang; git ls-files keeps
      # out what ansible-lint installs into the checkout (.ansible/, .cache/). Templates (*.sh.j2) are
      # not valid shell before rendering and are left to the AI review.
      - name: Shell Lint
        run: |
          # without pipefail a failing git ls-files would pass the step with nothing checked
          set -o pipefail
          git ls-files -z |
            while IFS= read -r -d '' f; do
              case ${f##*/} in
                *.sh | *.bash) printf '%s\0' "$f" ;;
                *.*) ;;
                *) if head -n 1 "$f" | grep -qE '^#! ?/(usr/)?bin/(env +)?(ba)?sh([[:space:]]|$)'; then printf '%s\0' "$f"; fi ;;
              esac
            done | xargs -0 -r shellcheck

  # Independent of the changes job: every pull request, whatever it changed, and every push the
  # caller's paths-ignore lets through. A secret in a path changes ignores (README, .gitea/**)
  # counts too. The scanner's built-in rules only: a .gitleaks.toml, .gitleaksignore or inline
  # gitleaks:allow in the change cannot switch the scan off. --redact keeps findings out of the log.
  secret-scan:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:5b89c9cd73590b5368ee028ae99168809813bab8a4e42381b973a4428d8c94ac
    steps:
      # A pull request is scanned commit by commit, so a secret added and removed again inside it is
      # found (full history, so the base commit resolves); a push or dispatch scans the checked-out tree.
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          config=$(mktemp)
          printf '[extend]\nuseDefault = true\n' > "$config"
          rm -f .gitleaksignore
          if [ "$EVENT_NAME" = pull_request ]; then
            # the commits of the pull request: reachable from its head, not from the target branch
            base=${BASE_SHA:-origin/$BASE_REF}
            git rev-parse --verify --quiet "$base^{commit}" > /dev/null || { echo "Cannot resolve the pull request base '$base'" >&2; exit 1; }
            echo "Scanning the commits $base..HEAD"
            gitleaks git --log-opts="$base..HEAD" --config "$config" --ignore-gitleaks-allow --redact --no-banner .
          else
            gitleaks dir . --config "$config" --ignore-gitleaks-allow --redact --no-banner
          fi

  # The role's argument specs and asserts against the real infra inventories: every host an infra
  # playbook applies the role to, local connection, no test server (scripts/infra-spec-check.py).
  infra-spec:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:5b89c9cd73590b5368ee028ae99168809813bab8a4e42381b973a4428d8c94ac
    needs: [changes, lint]
    if: needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true'
    steps:
      # Role code from the change runs in this job: no checkout keeps its token in .git/config
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout infra repository
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: infrastructure/infra
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_infra
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /group_vars/
            /host_vars/
            /inventories/
            /*.yml

      - name: Checkout the check script
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts

      - name: Check the role against the infra inventories
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"
          unset ANSIBLE_VAULT_PASSWORD
          export ANSIBLE_VAULT_PASSWORD_FILE="$GITHUB_WORKSPACE/.vault"
          python3 git_molecule/scripts/infra-spec-check.py "$GITHUB_WORKSPACE" git_infra "${GITHUB_REPOSITORY#*/}"

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}"
          shopt -s dotglob
          rm -rf ./*

  molecule-integration:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:5b89c9cd73590b5368ee028ae99168809813bab8a4e42381b973a4428d8c94ac
    needs: [changes, lint]
    if: (needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true') && github.event_name != 'push'
    env:
      TEST_TYPE: integration
      VULTR_SERVER_STATE: present
      MOLECULE_DISTRO: ${{ inputs.distro }}
      MOLECULE_SCENARIO_NAME: vultr
      INSTANCE_SIZE: ${{ inputs.instance_size }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo "${GITHUB_REPOSITORY#*/}" | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          # test hosts get new host keys every run; git.msqu.de stays checked against the keyscan above
          cat > ~/.ssh/config << EOF
          Host * !git.msqu.de
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout infra repository
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: infrastructure/infra
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_infra
          ref: main
          persist-credentials: false
          sparse-checkout: |
            group_vars/

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          persist-credentials: false
          sparse-checkout: |
            scenarios/vultr

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/molecule/default"
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/vultr/ \
            "${GITHUB_WORKSPACE}/molecule/default/"

      - name: Configure integration test variables
        run: |
          rsync -aP git_infra/group_vars "${GITHUB_WORKSPACE}/molecule/default/"

      - name: Setup debugging session
        if: inputs.molecule_debug == 'true'
        uses: https://github.com/mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        with:
          limit-access-to-actor: true
          # tmate, openssh-client and xz-utils come with the runner image
          install-dependencies: false

      - name: Run Molecule integration tests
        run: |
          # word splitting on purpose: args is one string of molecule options
          # shellcheck disable=SC2086
          molecule test $MOLECULE_ARGS
        env:
          MOLECULE_ARGS: ${{ inputs.args }}
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '1'
          CI_JOB_ID: ${{ github.run_id }}
          GITEA_TOKEN: ${{ secrets.CI_RUNNER_PAT }}
          GITHUB_TOKEN: ${{ secrets.CI_RUNNER_PAT_GITHUB }}
          MOLECULE_DEBUG: ${{ inputs.molecule_debug }}
          PY_COLORS: '1'
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}"
          shopt -s dotglob
          rm -rf ./*

  # Runs after all test jobs, also after failures and cancellations. The integration job leaves its
  # instance (VULTR_SERVER_STATE=present), so this job is what deletes it: molecule destroy, then a
  # sweep of this repo's instances and every molecule instance older than 3 hours
  # (scripts/cloud-sweep.sh). Skips with the tests: nothing relevant changed, or a push. A run that is
  # force-cancelled never gets here: .gitea/workflows/cloud-sweep.yml runs the sweep on a schedule.
  molecule-cleanup:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:5b89c9cd73590b5368ee028ae99168809813bab8a4e42381b973a4428d8c94ac
    if: always() && github.event_name != 'push' && (needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true')
    needs: [changes, molecule-integration]
    env:
      MOLECULE_SCENARIO_NAME: vultr
      MOLECULE_DISTRO: ${{ inputs.distro }}
      VULTR_SERVER_STATE: absent
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo "${GITHUB_REPOSITORY#*/}" | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          # test hosts get new host keys every run; git.msqu.de stays checked against the keyscan above
          cat > ~/.ssh/config << EOF
          Host * !git.msqu.de
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          persist-credentials: false
          sparse-checkout: |
            scenarios/vultr
            scripts

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/molecule/default"
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/vultr/ \
            "${GITHUB_WORKSPACE}/molecule/default/"

      - name: Destroy leftover molecule resources
        continue-on-error: true
        run: molecule destroy || echo "Cleanup failed or no resources to destroy"
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}

      # Fails when the API cannot be queried or a deletion fails; unlike the destroy above it is not
      # allowed to pass silently
      - name: Sweep leftover cloud resources
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: SWEEP_PROJECT="$CI_PROJECT_NAME_MOLECULE" bash git_molecule/scripts/cloud-sweep.sh vultr

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}"
          shopt -s dotglob
          rm -rf ./*
