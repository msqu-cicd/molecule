name: json-yaml-validate
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-yaml-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout.git@v5

      - name: json-yaml-validate
        id: json-yaml-validate
        uses: https://github.com/GrantBirki/json-yaml-validate.git@v3.3.2
