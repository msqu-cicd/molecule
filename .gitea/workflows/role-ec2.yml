          case "$INSTANCE_SIZE" in *g.*|*gd.*|*gn.*) arch=arm64 ;; *) arch=amd64 ;; esac
          case "$MOLECULE_DISTRO" in
            debian-*) owner=136693071363; name="${MOLECULE_DISTRO}-${arch}-*" ;;
            ubuntu-*) owner=099720109477; name="ubuntu/images/hvm-ssd-gp3/ubuntu-*-${MOLECULE_DISTRO#ubuntu-}-${arch}-server-*" ;;
            *) echo "Unsupported distro for ec2: $MOLECULE_DISTRO"; exit 1 ;;
          esac
          # Subnets come from Infrastructure/aws-molecule (tag molecule=true); spread jobs across zones
          subnet=$(python3 -c 'import boto3,random; s=boto3.client("ec2").describe_subnets(Filters=[{"Name":"tag:molecule","Values":["true"]}])["Subnets"]; print(random.choice(s)["SubnetId"])')
          {
            echo "EC2_IMAGE_OWNER=$owner"
            echo "EC2_IMAGE_NAME=$name"
            echo "EC2_SUBNET_ID=$subnet"
          } >> $GITHUB_ENV
          echo "image: $owner/$name ($arch), subnet: $subnet"

      - name: Setup debugging session
        if: inputs.molecule_debug == 'true'
        uses: https://github.com/mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        with:
          limit-access-to-actor: true
          # tmate, openssh-client and xz-utils come with the runner image
          install-dependencies: false

      - name: Run Molecule integration tests
        # word splitting of MOLECULE_ARGS is intended (multiple molecule CLI arguments)
        run: molecule test $MOLECULE_ARGS
        env:
          MOLECULE_ARGS: ${{ inputs.args }}
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '1'
          CI_JOB_ID: ${{ github.run_id }}
          GITEA_TOKEN: ${{ secrets.CI_RUNNER_PAT }}
          GITHUB_TOKEN: ${{ secrets.CI_RUNNER_PAT_GITHUB }}
          MOLECULE_DEBUG: ${{ inputs.molecule_debug }}
          PY_COLORS: '1'
          AWS_ACCESS_KEY_ID: ${{ secrets.MOLECULE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MOLECULE_AWS_SECRET_ACCESS_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *

  # Runs after all test jobs, also after failures and cancellations: terminates leftover instances
  # of this repo and, as a safety net, any molecule instance older than 3 hours
  molecule-cleanup:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:7745f58aeb8cedf9a2c7e11232f06c82c4658220c45739147d49c15844b20904
    if: always() && (inputs.unit == 'true' || inputs.integration == 'true')
    needs: [molecule-unit-debian, molecule-unit-ubuntu, molecule-integration-debian, molecule-integration-ubuntu]
    steps:
      - name: Terminate leftover molecule instances
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MOLECULE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MOLECULE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ inputs.region }}
        run: |
          python3 - <<'PY'
          import datetime, os
          import boto3
          project = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1].replace("_", "-")
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=3)
          ec2 = boto3.client("ec2")
          # Fails loudly if the API cannot be queried instead of reporting "nothing found"
          reservations = ec2.describe_instances(Filters=[
              {"Name": "tag:managed-by", "Values": ["molecule"]},
              {"Name": "instance-state-name", "Values": ["pending", "running", "stopping", "stopped"]},
          ])["Reservations"]
          doomed = []
          for instance in (i for r in reservations for i in r["Instances"]):
              tags = {t["Key"]: t["Value"] for t in instance.get("Tags", [])}
              reason = "this repo" if tags.get("project") == project else "older than 3h" if instance["LaunchTime"] < cutoff else None
              if reason:
                  print(f"Terminating {instance['InstanceId']} ({tags.get('Name')}, {reason})")
                  doomed.append(instance["InstanceId"])
          if doomed:
              ec2.terminate_instances(InstanceIds=doomed)
          else:
              print("No leftover molecule instances")
          PY
