# Reusable molecule workflow for Ansible roles (ec2 scenario).
# Called from each role's .gitea/workflows/molecule.yml; see README.md for the caller template.
name: Molecule (ec2)

on:
  workflow_call:
    inputs:
      force_run:
        description: Run the tests even if no relevant files changed ('true'/'false')
        type: string
        default: 'false'
      args:
        description: Additional arguments passed to molecule test
        type: string
        default: ''
      molecule_debug:
        description: Open a tmate debugging session before the tests ('true'/'false')
        type: string
        default: 'false'
      unit:
        description: Run the unit test jobs ('true'/'false')
        type: string
        default: 'true'
      integration:
        description: Run the integration test jobs ('true'/'false')
        type: string
        default: 'true'
      debian_distro:
        description: Debian release for the Debian jobs (debian-<version>)
        type: string
        default: debian-13
      ubuntu_distro:
        description: Ubuntu release for the Ubuntu jobs (ubuntu-<version>)
        type: string
        default: ubuntu-26.04
      region:
        description: AWS region of the Infrastructure/aws-molecule network
        type: string
        default: eu-central-1
      instance_size:
        description: Server type/plan, empty uses the scenario default
        type: string
        default: ''
      extra_files_ignore:
        description: Additional changed-files ignore patterns, one per line (e.g. 'files/**')
        type: string
        default: ''
      molecule_ref:
        description: Ref of CICD/molecule to take the scenario from
        type: string
        default: main
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      CI_RUNNER_PAT:
        required: true
      CI_RUNNER_PAT_GITHUB:
        required: false
      ANSIBLE_VAULT_PASSWORD:
        required: true
      MOLECULE_AWS_ACCESS_KEY_ID:
        required: true
      MOLECULE_AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      any_modified: ${{ steps.changed.outputs.any_modified }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      # any_modified also counts deleted files (any_changed does not)
      - id: changed
        uses: https://github.com/tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_ignore: |
            .ansible-lint
            .gitea/**
            .github/**
            .yamllint
            Makefile
            meta/main.yml
            README.md
            renovate.json
            ${{ inputs.extra_files_ignore }}

  lint:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:7745f58aeb8cedf9a2c7e11232f06c82c4658220c45739147d49c15844b20904
    needs: changes
    if: needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true'
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Ansible Lint
        run: ansible-lint -c .ansible-lint .

      - name: Yaml Lint
        run: yamllint -f colored .

  molecule-unit-debian:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:7745f58aeb8cedf9a2c7e11232f06c82c4658220c45739147d49c15844b20904
    needs: [changes, lint]
    if: (needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true') && inputs.unit == 'true'
    env:
      TEST_TYPE: unit
      AWS_DEFAULT_REGION: ${{ inputs.region }}
      INSTANCE_REGION: ${{ inputs.region }}
      MOLECULE_DISTRO: ${{ inputs.debian_distro }}
      MOLECULE_SCENARIO_NAME: ec2
      INSTANCE_SIZE: ${{ inputs.instance_size }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo ${GITHUB_REPOSITORY#*/} | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> $GITHUB_ENV

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          sparse-checkout: |
            scenarios/ec2

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/molecule/default
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/ec2/ \
            ${GITHUB_WORKSPACE}/molecule/default/

      - name: Configure unit test variables
        run: |
          if [[ -f "${GITHUB_WORKSPACE}/tests/vars.yml" ]]; then
            mkdir -p ${GITHUB_WORKSPACE}/molecule/default/group_vars/all/
            rsync -aP ${GITHUB_WORKSPACE}/tests/vars.yml \
              ${GITHUB_WORKSPACE}/molecule/default/group_vars/all/test_vars.yml
          fi

      - name: Resolve EC2 image and subnet
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MOLECULE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MOLECULE_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Graviton families (t4g, m7g, ...) need arm64 images
          case "$INSTANCE_SIZE" in *g.*|*gd.*|*gn.*) arch=arm64 ;; *) arch=amd64 ;; esac
          case "$MOLECULE_DISTRO" in
            debian-*) owner=136693071363; name="${MOLECULE_DISTRO}-${arch}-*" ;;
            ubuntu-*) owner=099720109477; name="ubuntu/images/hvm-ssd-gp3/ubuntu-*-${MOLECULE_DISTRO#ubuntu-}-${arch}-server-*" ;;
            *) echo "Unsupported distro for ec2: $MOLECULE_DISTRO"; exit 1 ;;
          esac
          # Subnets come from Infrastructure/aws-molecule (tag molecule=true); spread jobs across zones
          subnet=$(python3 -c 'import boto3,random; s=boto3.client("ec2").describe_subnets(Filters=[{"Name":"tag:molecule","Values":["true"]}])["Subnets"]; print(random.choice(s)["SubnetId"])')
          {
            echo "EC2_IMAGE_OWNER=$owner"
            echo "EC2_IMAGE_NAME=$name"
            echo "EC2_SUBNET_ID=$subnet"
          } >> $GITHUB_ENV
          echo "image: $owner/$name ($arch), subnet: $subnet"

      - name: Setup debugging session
        if: inputs.molecule_debug == 'true'
        uses: https://github.com/mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        with:
          limit-access-to-actor: true
          # tmate, openssh-client and xz-utils come with the runner image
          install-dependencies: false

      - name: Run Molecule unit tests
        # word splitting of MOLECULE_ARGS is intended (multiple molecule CLI arguments)
        run: molecule test $MOLECULE_ARGS
        env:
          MOLECULE_ARGS: ${{ inputs.args }}
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '1'
          CI_JOB_ID: ${{ github.run_id }}
          GITEA_TOKEN: ${{ secrets.CI_RUNNER_PAT }}
          GITHUB_TOKEN: ${{ secrets.CI_RUNNER_PAT_GITHUB }}
          MOLECULE_DEBUG: ${{ inputs.molecule_debug }}
          PY_COLORS: '1'
          AWS_ACCESS_KEY_ID: ${{ secrets.MOLECULE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MOLECULE_AWS_SECRET_ACCESS_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *

