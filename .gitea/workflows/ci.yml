name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-yaml-validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: json-yaml-validate
        uses: https://github.com/GrantBirki/json-yaml-validate.git@250fa0dc7d7f4a888b24dc2a6b2ff589753fba70  # v3.3.2

  lint:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:a8f5049e07636e335e70dec5992b1cb539a9d42b6ba7c426a7ecb85e8ff2ca53
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Ansible Lint scenarios
        run: ansible-lint --offline scenarios/

      # the files every role copies, with their own config
      - name: Ansible Lint examples
        run: ansible-lint --offline -c examples/.ansible-lint examples/

      - name: Yaml Lint
        run: yamllint -f colored scenarios .gitea examples
