name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-yaml-validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: json-yaml-validate
        uses: https://github.com/GrantBirki/json-yaml-validate.git@250fa0dc7d7f4a888b24dc2a6b2ff589753fba70  # v3.3.2

  lint:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:b71f5b9e573b2eb58d3e55b47a53063fcb77a4c5f6cfb680086f3920d3b2e977
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Ansible Lint scenarios
        run: ansible-lint --offline scenarios/

      - name: Yaml Lint
        run: yamllint -f colored scenarios .gitea
