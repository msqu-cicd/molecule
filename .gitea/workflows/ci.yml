name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-yaml-validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: json-yaml-validate
        uses: https://github.com/GrantBirki/json-yaml-validate.git@250fa0dc7d7f4a888b24dc2a6b2ff589753fba70  # v3.3.2

  lint:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:bcca5b3c1f392bf7d796dd097cdc89c84f69f335cb2af30eae068aae578fd421
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Ansible Lint scenarios
        run: ansible-lint --offline scenarios/

      # the files every role copies, with their own config
      - name: Ansible Lint examples
        run: ansible-lint --offline -c examples/.ansible-lint examples/

      - name: Yaml Lint
        run: yamllint -f colored scenarios .gitea examples

      # The runner image has no ruff or flake8: compile the script and run its fixture tests (real ansible-playbook runs)
      - name: Check scripts
        run: |
          python3 -m py_compile scripts/infra-spec-check.py scripts/tests/test_infra_spec_check.py
          python3 -m unittest discover -v scripts/tests

      # The runner image's shellcheck checks the run: blocks; .gitea/actionlint.yaml holds the
      # Gitea runner labels and ignores the full-URL uses: form Gitea supports
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12 # renovate: datasource=github-releases depName=rhysd/actionlint
        run: |
          set -o pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir=$(mktemp -d)
          curl -fsSL --retry 2 -o "$dir/$tarball" "$base/$tarball"
          curl -fsSL --retry 2 "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep "  ${tarball}\$" > "$dir/sum"
          (cd "$dir" && sha256sum -c sum)
          tar -xzf "$dir/$tarball" -C /usr/local/bin actionlint

      - name: actionlint
        run: actionlint -config-file .gitea/actionlint.yaml .gitea/workflows/*.yml examples/caller-molecule.yml
