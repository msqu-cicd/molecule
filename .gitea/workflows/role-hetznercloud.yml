# Reusable molecule workflow for Ansible roles (hetznercloud scenario), Debian only. For roles the
# kvm runner cannot test, e.g. multi-node scenarios whose servers must reach each other (k3s, rke2);
# every other role uses role-kvm.yml. Pushes to the default branch (merges, already tested in their
# pull request) run lint only, so they start no Hetzner servers.
# Called from each role's .gitea/workflows/molecule.yml; see README.md for the caller template.
name: Molecule (hetznercloud)

on:
  workflow_call:
    inputs:
      force_run:
        description: Run the tests even if no relevant files changed ('true'/'false')
        type: string
        default: 'false'
      args:
        description: Additional arguments passed to molecule test
        type: string
        default: ''
      molecule_debug:
        description: Open a tmate debugging session before the tests ('true'/'false')
        type: string
        default: 'false'
      unit:
        description: Run the unit test jobs ('true'/'false')
        type: string
        default: 'true'
      integration:
        description: Run the integration test jobs ('true'/'false')
        type: string
        default: 'true'
      debian_distro:
        description: Hetzner image for the Debian jobs
        type: string
        default: debian-13
      instance_size:
        description: Server type/plan, empty uses the scenario default
        type: string
        default: ''
      extra_files_ignore:
        description: Additional changed-files ignore patterns, one per line (e.g. 'files/**')
        type: string
        default: ''
      molecule_ref:
        description: Ref of CICD/molecule to take the scenario from
        type: string
        default: main
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      CI_RUNNER_PAT:
        required: true
      CI_RUNNER_PAT_GITHUB:
        required: false
      ANSIBLE_VAULT_PASSWORD:
        required: true
      HCLOUD_TOKEN:
        required: true
      HETZNER_DNS_TOKEN:
        required: false

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      # a push its pull request already tested counts as unchanged: lint and tests skip
      any_modified: ${{ steps.tested.outputs.tested == 'true' && 'false' || steps.changed.outputs.any_modified }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          # the merge commit and its parents
          fetch-depth: 2

      # A merge commit whose tree equals its second parent (the pull request head, up to date with
      # the target branch) or a fast-forward to the head itself adds nothing the pull request run
      # did not test. Any other push, or a failed lookup, runs the tests.
      - name: Detect a push its pull request already tested
        id: tested
        if: github.event_name == 'push'
        env:
          API: https://git.msqu.de/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.CI_RUNNER_PAT }}
        run: |
          tested=false
          candidate=$(git rev-parse HEAD)
          if second=$(git rev-parse -q --verify 'HEAD^2^{commit}'); then
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              candidate=$second
            else
              candidate=
            fi
          fi
          if [ -n "$candidate" ]; then
            # the caller job's status sums up the whole molecule run of the pull request
            state=$(curl -fsS -H "Authorization: token $TOKEN" "$API/commits/$candidate/status" |
              jq -r '[.statuses[]? | select(.context | endswith("/ molecule (pull_request)")) | .status] | first // empty') || state=
            echo "pull request run of $candidate: ${state:-none}"
            if [ "$state" = success ]; then
              tested=true
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      # any_modified also counts deleted files (any_changed does not)
      - id: changed
        if: steps.tested.outputs.tested != 'true'
        uses: https://github.com/tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_ignore: |
            .ansible-lint
            .gitea/**
            .github/**
            .yamllint
            Makefile
            meta/main.yml
            README.md
            renovate.json
            ${{ inputs.extra_files_ignore }}

  lint:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:a5afe0d813f4c069aed85b411fabb02a8e08c0b606a424624998e2afc93abdf6
    needs: changes
    if: needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true'
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Ansible Lint
        run: ansible-lint -c .ansible-lint .

      - name: Yaml Lint
        run: yamllint -f colored .

  # The role's argument specs and asserts against the real infra inventories: every host an infra
  # playbook applies the role to, local connection, no test server (scripts/infra-spec-check.py).
  infra-spec:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:a5afe0d813f4c069aed85b411fabb02a8e08c0b606a424624998e2afc93abdf6
    needs: [changes, lint]
    if: needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true'
    steps:
      # Role code from the change runs in this job: no checkout keeps its token in .git/config
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout infra repository
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: infrastructure/infra
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_infra
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /group_vars/
            /host_vars/
            /inventories/
            /*.yml

      - name: Checkout the check script
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts

      - name: Check the role against the infra inventories
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"
          unset ANSIBLE_VAULT_PASSWORD
          export ANSIBLE_VAULT_PASSWORD_FILE="$GITHUB_WORKSPACE/.vault"
          python3 git_molecule/scripts/infra-spec-check.py "$GITHUB_WORKSPACE" git_infra "${GITHUB_REPOSITORY#*/}"

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *

  molecule-unit-debian:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:a5afe0d813f4c069aed85b411fabb02a8e08c0b606a424624998e2afc93abdf6
    needs: [changes, lint]
    if: (needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true') && inputs.unit == 'true' && github.event_name != 'push'
    env:
      TEST_TYPE: unit
      HCLOUD_SERVER_STATE: stopped
      MOLECULE_DISTRO: ${{ inputs.debian_distro }}
      MOLECULE_SCENARIO_NAME: hetznercloud
      INSTANCE_SIZE: ${{ inputs.instance_size }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo ${GITHUB_REPOSITORY#*/} | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> $GITHUB_ENV

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          sparse-checkout: |
            scenarios/hetznercloud

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/molecule/default
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/hetznercloud/ \
            ${GITHUB_WORKSPACE}/molecule/default/

      - name: Configure unit test variables
        run: |
          if [[ -f "${GITHUB_WORKSPACE}/tests/vars.yml" ]]; then
            mkdir -p ${GITHUB_WORKSPACE}/molecule/default/group_vars/all/
            rsync -aP ${GITHUB_WORKSPACE}/tests/vars.yml \
              ${GITHUB_WORKSPACE}/molecule/default/group_vars/all/test_vars.yml
          fi

      - name: Setup debugging session
        if: inputs.molecule_debug == 'true'
        uses: https://github.com/mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        with:
          limit-access-to-actor: true
          # tmate, openssh-client and xz-utils come with the runner image
          install-dependencies: false

      - name: Run Molecule unit tests
        # word splitting of MOLECULE_ARGS is intended (multiple molecule CLI arguments)
        run: molecule test $MOLECULE_ARGS
        env:
          MOLECULE_ARGS: ${{ inputs.args }}
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '1'
          CI_JOB_ID: ${{ github.run_id }}
          GITEA_TOKEN: ${{ secrets.CI_RUNNER_PAT }}
          GITHUB_TOKEN: ${{ secrets.CI_RUNNER_PAT_GITHUB }}
          MOLECULE_DEBUG: ${{ inputs.molecule_debug }}
          PY_COLORS: '1'
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_DNS_TOKEN: ${{ secrets.HETZNER_DNS_TOKEN }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *

  molecule-integration-debian:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:a5afe0d813f4c069aed85b411fabb02a8e08c0b606a424624998e2afc93abdf6
    needs: [changes, lint, molecule-unit-debian]
    if: always() && github.event_name != 'push' && (needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true') && inputs.integration == 'true' && needs.lint.result == 'success' && (needs.molecule-unit-debian.result == 'success' || inputs.unit != 'true')
    env:
      TEST_TYPE: integration
      HCLOUD_SERVER_STATE: stopped
      MOLECULE_DISTRO: ${{ inputs.debian_distro }}
      MOLECULE_SCENARIO_NAME: hetznercloud
      INSTANCE_SIZE: ${{ inputs.instance_size }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo ${GITHUB_REPOSITORY#*/} | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> $GITHUB_ENV

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout infra repository
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: infrastructure/infra
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_infra
          ref: main
          sparse-checkout: |
            group_vars/

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          sparse-checkout: |
            scenarios/hetznercloud

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/molecule/default
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/hetznercloud/ \
            ${GITHUB_WORKSPACE}/molecule/default/

      - name: Configure integration test variables
        run: |
          rsync -aP git_infra/group_vars ${GITHUB_WORKSPACE}/molecule/default/

      - name: Setup debugging session
        if: inputs.molecule_debug == 'true'
        uses: https://github.com/mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        with:
          limit-access-to-actor: true
          # tmate, openssh-client and xz-utils come with the runner image
          install-dependencies: false

      - name: Run Molecule integration tests
        # word splitting of MOLECULE_ARGS is intended (multiple molecule CLI arguments)
        run: molecule test $MOLECULE_ARGS
        env:
          MOLECULE_ARGS: ${{ inputs.args }}
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '1'
          CI_JOB_ID: ${{ github.run_id }}
          GITEA_TOKEN: ${{ secrets.CI_RUNNER_PAT }}
          GITHUB_TOKEN: ${{ secrets.CI_RUNNER_PAT_GITHUB }}
          MOLECULE_DEBUG: ${{ inputs.molecule_debug }}
          PY_COLORS: '1'
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_DNS_TOKEN: ${{ secrets.HETZNER_DNS_TOKEN }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *

  molecule-cleanup:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:a5afe0d813f4c069aed85b411fabb02a8e08c0b606a424624998e2afc93abdf6
    if: always() && github.event_name != 'push' && (inputs.unit == 'true' || inputs.integration == 'true')
    needs: [molecule-unit-debian, molecule-integration-debian]
    env:
      MOLECULE_SCENARIO_NAME: hetznercloud
      MOLECULE_DISTRO: ${{ inputs.debian_distro }}
      HCLOUD_SERVER_STATE: absent
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo ${GITHUB_REPOSITORY#*/} | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> $GITHUB_ENV

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          sparse-checkout: |
            scenarios/hetznercloud

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/molecule/default
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/hetznercloud/ \
            ${GITHUB_WORKSPACE}/molecule/default/

      - name: Destroy leftover molecule resources
        continue-on-error: true
        run: molecule destroy || echo "Cleanup failed or no resources to destroy"
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HETZNER_DNS_TOKEN: ${{ secrets.HETZNER_DNS_TOKEN }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Cleanup orphaned cloud resources
        continue-on-error: true
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          echo "Checking for orphaned cloud resources..."
          # Fail loudly if the API cannot be queried instead of reporting "nothing found"
          ALL_SERVERS=$(hcloud server list -o noheader -o columns=name,age)
          echo "Looking for servers: molecule-${CI_PROJECT_NAME_MOLECULE}[-nodeN]"
          SERVER_LIST=$(echo "$ALL_SERVERS" | awk '{print $1}' | grep -Ex "molecule-${CI_PROJECT_NAME_MOLECULE}(-node[0-9]+)?" || true)
          if [ -n "$SERVER_LIST" ]; then
            echo "Found orphaned servers:"
            echo "$SERVER_LIST"
            echo "$SERVER_LIST" | while read -r server; do
              echo "Deleting server: $server"
              hcloud server delete "$server" || echo "Failed to delete $server"
            done
          else
            echo "No orphaned servers found"
          fi

          # Safety net for molecule servers of any repo older than 3 hours, selected by the
          # managed-by=molecule label of the scenario's platforms (hcloud age: Xs/Xm/Xh up to 23h, then Xd)
          echo "Checking for old molecule servers (label managed-by=molecule, >3 hours old)..."
          MOLECULE_SERVERS=$(hcloud server list -l managed-by=molecule -o noheader -o columns=name,age)
          OLD_SERVERS=$(echo "$MOLECULE_SERVERS" | awk '$2 ~ /^([3-9]|1[0-9]|2[0-3])h$|^[0-9]+d$/ {print $1}')
          if [ -n "$OLD_SERVERS" ]; then
            echo "Found old molecule servers:"
            echo "$OLD_SERVERS"
            echo "$OLD_SERVERS" | while read -r server; do
              echo "Deleting old server: $server"
              hcloud server delete "$server" || echo "Failed to delete old server $server"
            done
          else
            echo "No old molecule servers found"
          fi

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *
