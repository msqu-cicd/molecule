# Reusable molecule workflow for Ansible roles (kvm scenario: QEMU guests inside the job
# container on the `kvm` runner, no cloud account involved). Same inputs as
# role-hetznercloud.yml except instance_size, which becomes kvm_memory/kvm_vcpus.
# Called from each role's .gitea/workflows/molecule.yml; see README.md for the caller template.
name: Molecule (kvm)

on:
  workflow_call:
    inputs:
      force_run:
        description: Run the tests even if no relevant files changed ('true'/'false')
        type: string
        default: 'false'
      args:
        description: Additional arguments passed to molecule test
        type: string
        default: ''
      molecule_debug:
        description: Open a tmate debugging session before the tests ('true'/'false')
        type: string
        default: 'false'
      unit:
        description: Run the unit test jobs ('true'/'false')
        type: string
        default: 'true'
      integration:
        description: Run the integration test jobs ('true'/'false')
        type: string
        default: 'true'
      debian_distro:
        description: Cloud image for the Debian jobs (debian-12 or debian-13)
        type: string
        default: debian-13
      ubuntu_distro:
        description: Cloud image for the Ubuntu jobs (ubuntu-24.04 or ubuntu-26.04)
        type: string
        default: ubuntu-26.04
      kvm_memory:
        description: Guest memory in MiB
        type: string
        default: '2048'
      kvm_vcpus:
        description: Guest vCPUs
        type: string
        default: '2'
      extra_files_ignore:
        description: Additional changed-files ignore patterns, one per line (e.g. 'files/**')
        type: string
        default: ''
      molecule_ref:
        description: Ref of CICD/molecule to take the scenario from
        type: string
        default: main
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      CI_RUNNER_PAT:
        required: true
      CI_RUNNER_PAT_GITHUB:
        required: false
      ANSIBLE_VAULT_PASSWORD:
        required: true
      # not used here; declared so a caller template written for role-hetznercloud.yml keeps working
      HCLOUD_TOKEN:
        required: false
      HETZNER_DNS_TOKEN:
        required: false

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      any_modified: ${{ steps.changed.outputs.any_modified }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      # any_modified also counts deleted files (any_changed does not)
      - id: changed
        uses: https://github.com/tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_ignore: |
            .ansible-lint
            .gitea/**
            .github/**
            .yamllint
            Makefile
            meta/main.yml
            README.md
            renovate.json
            ${{ inputs.extra_files_ignore }}

  lint:
    runs-on: molecule
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:4e04bf90251e6f9cff6f9fd7226bee72c23b54e85f4c2156e4f9ea03e6b3a7f6
    needs: changes
    if: needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true'
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Ansible Lint
        run: ansible-lint -c .ansible-lint .

      - name: Yaml Lint
        run: yamllint -f colored .

  molecule-unit-debian:
    runs-on: kvm
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:4e04bf90251e6f9cff6f9fd7226bee72c23b54e85f4c2156e4f9ea03e6b3a7f6
      volumes:
        # base image cache on the runner host (any host path is allowed by the runner config)
        - /var/cache/molecule-images:/var/cache/molecule-images
    needs: [changes, lint]
    if: (needs.changes.outputs.any_modified == 'true' || inputs.force_run == 'true') && inputs.unit == 'true'
    env:
      TEST_TYPE: unit
      MOLECULE_DISTRO: ${{ inputs.debian_distro }}
      MOLECULE_SCENARIO_NAME: kvm
      KVM_MEMORY: ${{ inputs.kvm_memory }}
      KVM_VCPUS: ${{ inputs.kvm_vcpus }}
      # exec tmpfs provided by the kvm runner; disks and seeds of the run live here
      KVM_WORK_DIR: /tmp/molecule-kvm
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7

      - name: Set environment variables
        run: |
          {
            echo "CI_HOSTNAME=$(echo '${{ env.MOLECULE_DISTRO }}' | tr -dc '[:alnum:]\n\r' | tr '[:upper:]' '[:lower:]')"
            echo "CI_PROJECT_NAME_MOLECULE=$(echo ${GITHUB_REPOSITORY#*/} | tr '_' '-')"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
          } >> $GITHUB_ENV

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH Key Fingerprint: $(ssh-keygen -l -E md5 -f ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22222 git.msqu.de >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF

      - name: Checkout molecule scenarios
        uses: https://github.com/actions/checkout@v7
        with:
          github-server-url: https://git.msqu.de
          repository: cicd/molecule
          token: '${{ secrets.CI_RUNNER_PAT }}'
          path: git_molecule
          ref: ${{ inputs.molecule_ref }}
          sparse-checkout: |
            scenarios/kvm

      - name: Prepare Ansible Vault
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$GITHUB_WORKSPACE/.vault"

      - name: Setup molecule scenario
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/molecule/default
          rsync -avzh --ignore-existing --ignore-errors \
            git_molecule/scenarios/kvm/ \
            ${GITHUB_WORKSPACE}/molecule/default/

      - name: Configure unit test variables
        run: |
          if [[ -f "${GITHUB_WORKSPACE}/tests/vars.yml" ]]; then
            mkdir -p ${GITHUB_WORKSPACE}/molecule/default/group_vars/all/
            rsync -aP ${GITHUB_WORKSPACE}/tests/vars.yml \
              ${GITHUB_WORKSPACE}/molecule/default/group_vars/all/test_vars.yml
          fi

      - name: Setup debugging session
        if: inputs.molecule_debug == 'true'
        uses: https://github.com/mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
        with:
          limit-access-to-actor: true
          # tmate, openssh-client and xz-utils come with the runner image
          install-dependencies: false

      - name: Install QEMU
        # no-op once the runner image ships these packages
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          fi

      - name: Run Molecule unit tests
        # word splitting of MOLECULE_ARGS is intended (multiple molecule CLI arguments)
        run: molecule test $MOLECULE_ARGS
        env:
          MOLECULE_ARGS: ${{ inputs.args }}
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '1'
          CI_JOB_ID: ${{ github.run_id }}
          GITEA_TOKEN: ${{ secrets.CI_RUNNER_PAT }}
          GITHUB_TOKEN: ${{ secrets.CI_RUNNER_PAT_GITHUB }}
          MOLECULE_DEBUG: ${{ inputs.molecule_debug }}
          PY_COLORS: '1'
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          cd ${GITHUB_WORKSPACE}
          shopt -s dotglob
          rm -rf *

  molecule-unit-ubuntu:
    runs-on: kvm
    container:
      image: ghcr.io/msqu-devops/molecule:runner@sha256:4e04bf90251e6f9cff6f9fd7226bee72c23b54e85f4c2156e4f9ea03e6b3a7f6
