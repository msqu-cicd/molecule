---
# Try each server type and location candidate until one succeeds for a platform
- name: Try {{ current_server_type }} in {{ current_location }} for {{ current_platform.name }}
  when: current_platform.name not in (created_servers | default({}))
  block:
    - name: Create {{ current_platform.name }} with {{ current_server_type }} in {{ current_location }}
      hetzner.hcloud.server:
        name: "{{ current_platform.name }}"
        server_type: "{{ current_server_type }}"
        ssh_keys:
          - "{{ final_ssh_key_name }}"
          - "michael@eifel"
        image: "{{ current_platform.image }}"
        location: "{{ current_location | default(omit, true) }}"
        datacenter: "{{ current_platform.datacenter | default(omit) }}"
        labels: "{{ current_platform.labels | default({}) }}"
        user_data: "{{ server_user_data }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        state: "{{ hetzner_server_state }}"
      register: server_attempt

    - name: Record created server
      ansible.builtin.set_fact:
        created_servers: >-
          {{ created_servers | default({}) | combine({
            current_platform.name: {
              'hcloud_server': server_attempt.hcloud_server,
              'platform': current_platform
            }
          }) }}

    - name: Log success
      ansible.builtin.debug:
        msg: "Created {{ current_platform.name }} with {{ current_server_type }} in {{ server_attempt.hcloud_server.location }}"

  rescue:
    - name: Log failure, trying next
      ansible.builtin.debug:
        msg: >-
          {{ current_server_type }} in {{ current_location }} failed for {{ current_platform.name }}
          ({{ ansible_failed_result.msg | default('no message') }}), trying next...
