---
# Individual server creation attempt with error handling
- name: Attempt server creation with {{ attempt_server_type }}
  when: not server_created
  block:
    - name: Create server {{ platform_item.name }} with {{ attempt_server_type }}
      hetzner.hcloud.server:
        name: "{{ platform_item.name }}"
        server_type: "{{ attempt_server_type }}"
        ssh_keys:
          - "{{ final_ssh_key_name }}"
          - "michael@eifel"
        image: "{{ platform_item.image }}"
        location: "{{ platform_item.location | default(omit) }}"
        datacenter: "{{ platform_item.datacenter | default(omit) }}"
        labels: "{{ platform_item.labels | default({}) }}"
        user_data: |
          #cloud-config
          package_update: false
          package_upgrade: false
          users:
            - name: root
              lock_passwd: false
              hashed_passwd: '$6$oJUDvM930K9.f5ov$CpD4WF/UgV9h8lcTpb8wYqAdasT/iT4oWsZGwvmbrbbeah7jlC8U/gQt53q02OVJAjJ4xxLtq8cAKYK/iy8LK0'
          ssh_pwauth: true
          disable_root: false
          apt:
            conf: |
              APT::Periodic::Update-Package-Lists "0";
              APT::Periodic::Download-Upgradeable-Packages "0";
              APT::Periodic::AutocleanInterval "0";
              APT::Periodic::Unattended-Upgrade "0";
          runcmd:
            - systemctl stop unattended-upgrades
            - systemctl disable unattended-upgrades
            - systemctl stop apt-daily.service
            - systemctl disable apt-daily.service
            - systemctl stop apt-daily.timer
            - systemctl disable apt-daily.timer
            - systemctl stop apt-daily-upgrade.service
            - systemctl disable apt-daily-upgrade.service
            - systemctl stop apt-daily-upgrade.timer
            - systemctl disable apt-daily-upgrade.timer
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        state: "{{ hetzner_server_state }}"
      register: server_attempt_result

    - name: Mark server as created
      ansible.builtin.set_fact:
        server_created: true
        successful_result:
          hcloud_server: "{{ server_attempt_result.hcloud_server }}"
          item:
            item: "{{ platform_item }}"
          used_server_type: "{{ attempt_server_type }}"

    - name: Display successful server type
      ansible.builtin.debug:
        msg: "Successfully created {{ platform_item.name }} with server type: {{ attempt_server_type }}"

    - name: Append to server creation results
      ansible.builtin.set_fact:
        server_creation_results: "{{ (server_creation_results | default([])) + [successful_result] }}"

  rescue:
    - name: Log failed attempt
      ansible.builtin.debug:
        msg: "Server type {{ attempt_server_type }} unavailable for {{ platform_item.name }}, trying next fallback..."
      when: attempt_index < (current_fallback_types | length - 1)

    - name: Log final failure
      ansible.builtin.debug:
        msg: "Server type {{ attempt_server_type }} unavailable for {{ platform_item.name }} (last fallback option)"
      when: attempt_index >= (current_fallback_types | length - 1)
