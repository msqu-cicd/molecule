---
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log }}"
  vars:
    ssh_port: 22
    ssh_user: root
    ssh_id_path: "~/.ssh/id_ed25519"
  tasks:
    - name: Check if SSH key already exists
      ansible.builtin.stat:
        path: "{{ ssh_id_path }}"
      register: id_ed25519_stat

    - name: Check if SSH public key already exists
      ansible.builtin.stat:
        path: "{{ ssh_id_path }}.pub"
      register: id_ed25519_pub_stat

    - name: Use existing SSH key
      when: id_ed25519_stat.stat.exists
      block:
        - name: Create public SSH key
          ansible.builtin.shell: |
            ssh-keygen -y -f {{ ssh_id_path }} > {{ ssh_id_path }}.pub
          changed_when: false
          when: not id_ed25519_pub_stat.stat.exists

        - name: Register the SSH key facts
          ansible.builtin.set_fact:
            existing_ssh_key_name: "molecule"
            generated_public_ssh_key: "{{ lookup('ansible.builtin.file', ssh_id_path + '.pub') }}"

        - name: Register SSH key for test instance(s)
          hetzner.hcloud.ssh_key:
            name: "{{ existing_ssh_key_name }}"
            public_key: "{{ generated_public_ssh_key }}"
            api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
            state: present
          register: molecule_ssh_key
          # The same key may already be registered under another name; anything else is a real error
          failed_when:
            - molecule_ssh_key is failed
            - "'already' not in (molecule_ssh_key.msg | default(''))"

    - name: Create new SSH key
      when: not id_ed25519_stat.stat.exists
      block:
        - name: Create SSH key
          community.crypto.openssh_keypair:
            path: "{{ ssh_id_path }}"
            force: true
            type: ed25519
          register: generated_ssh_key

        - name: Register the SSH key name
          ansible.builtin.set_fact:
            ssh_key_name: "molecule-generated-{{ 12345 | random | to_uuid }}"

        - name: Register SSH key for test instance(s)
          hetzner.hcloud.ssh_key:
            name: "{{ ssh_key_name }}"
            public_key: "{{ generated_ssh_key.public_key }}"
            api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
            state: present

    - name: Set hetzner facts
      ansible.builtin.set_fact:
        hetzner_server_state: rebuild
        final_ssh_key_name: >-
          {% if id_ed25519_stat.stat.exists %}{{ existing_ssh_key_name }}{% else %}{{ ssh_key_name }}{% endif %}
        final_ssh_key_path: "{{ ssh_id_path }}"

    - name: Define server type fallbacks and user_data
      ansible.builtin.set_fact:
        server_type_fallbacks:
          cx23: ['cx23', 'cx33', 'cx43']
          cax11: ['cax11', 'cax21', 'cx23']
          cax21: ['cax21', 'cax31', 'cx33']
          cax31: ['cax31', 'cax41', 'cx43']
        server_user_data: |
          #cloud-config
          package_update: false
          package_upgrade: false
          users:
            - name: root
              lock_passwd: false
              hashed_passwd: '$6$oJUDvM930K9.f5ov$CpD4WF/UgV9h8lcTpb8wYqAdasT/iT4oWsZGwvmbrbbeah7jlC8U/gQt53q02OVJAjJ4xxLtq8cAKYK/iy8LK0'
          ssh_pwauth: true
          disable_root: false
          apt:
            conf: |
              APT::Periodic::Update-Package-Lists "0";
              APT::Periodic::Download-Upgradeable-Packages "0";
              APT::Periodic::AutocleanInterval "0";
              APT::Periodic::Unattended-Upgrade "0";
          runcmd:
            - systemctl stop unattended-upgrades
            - systemctl disable unattended-upgrades
            - systemctl stop apt-daily.service
            - systemctl disable apt-daily.service
            - systemctl stop apt-daily.timer
            - systemctl disable apt-daily.timer
            - systemctl stop apt-daily-upgrade.service
            - systemctl disable apt-daily-upgrade.service
            - systemctl stop apt-daily-upgrade.timer
            - systemctl disable apt-daily-upgrade.timer

    - name: Initialize created_servers dict
      ansible.builtin.set_fact:
        created_servers: {}

    - name: Try server types with fallback for each platform
      ansible.builtin.include_tasks: try_server_types.yml
      loop: >-
        {{ molecule_yml.platforms | product(
             server_type_fallbacks[molecule_yml.platforms[0].server_type]
             | default([molecule_yml.platforms[0].server_type])
           ) | list }}
      loop_control:
        loop_var: _platform_type
      vars:
        current_platform: "{{ _platform_type[0] }}"
        current_server_type: "{{ _platform_type[1] }}"

    - name: Fail if not all servers were created
      ansible.builtin.fail:
        msg: "Failed to create server {{ item.name }}"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in created_servers

    - name: Create volume(s)
      hetzner.hcloud.volume:
        name: "{{ item.1.name | default(item.0.name) }}"
        server: "{{ item.0.name }}"
        location: "{{ item.1.location | default(omit) }}"
        size: "{{ item.1.size | default(10) }}"
        labels: "{{ item.0.labels | default({}) }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        state: "present"
      loop: "{{ molecule_yml.platforms | subelements('volumes', skip_missing=True) }}"
      register: volumes
      async: 7200
      poll: 0

    - name: Wait for volume(s) creation to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: hetzner_volumes
      until: hetzner_volumes.finished
      retries: 300
      when:
        - volumes is defined
        - volumes.changed
      with_items: "{{ volumes.results }}"

    - name: Create private network(s)
      hetzner.hcloud.network:
        name: "{{ item.network[0].name }}"
        ip_range: "{{ item.network[0].ip_range | default(omit) }}"
        labels: "{{ item.labels | default({}) }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        state: "present"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        extended: yes
      when:
        - ansible_loop.first
        - lookup('ansible.builtin.env', 'HCLOUD_PRIVATE_NET', default='false') | bool
      register: networks
      async: 7200
      poll: 0

    - name: Wait for network(s) creation to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: hetzner_networks
      until: hetzner_networks.finished
      retries: 300
      when:
        - networks is defined
        - networks.changed
        - ansible_loop.first
        - lookup('ansible.builtin.env', 'HCLOUD_PRIVATE_NET', default='false') | bool
      loop: "{{ networks.results }}"
      loop_control:
        extended: yes

    - name: Create private subnetwork(s)
      hetzner.hcloud.subnetwork:
        network: "{{ item.network[0].name }}"
        ip_range: "{{ item.network[0].subnet[0].ip | ansible.utils.ipaddr('network/prefix') }}"
        network_zone: "{{ item.network[0].subnet[0].network_zone | default('eu-central') }}"
        type: "{{ item.network[0].subnet[0].type | default('cloud') }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        state: "present"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        extended: yes
      when:
        - ansible_loop.first
        - lookup('ansible.builtin.env', 'HCLOUD_PRIVATE_NET', default='false') | bool
      register: subnetworks

    - name: Attach Server to Subnetwork(s)
      hetzner.hcloud.server_network:
        network: "{{ item.network[0].name }}"
        server: "{{ item.name }}"
        ip: "{{ item.network[0].subnet[0].ip | ansible.utils.ipaddr('address') }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        state: "present"
      loop: "{{ molecule_yml.platforms }}"
      when: lookup('ansible.builtin.env', 'HCLOUD_PRIVATE_NET', default='false') | bool
      retries: 12
      delay: 10
      register: hcloud_server_network_result
      until: hcloud_server_network_result is not failed

    - name: Populate instance config dict
      ansible.builtin.set_fact:
        instance_conf_dict:
          {
            "instance": "{{ item.value.hcloud_server.name }}",
            "ssh_key_name": "{{ final_ssh_key_name }}",
            "address": "{{ item.value.hcloud_server.ipv4_address }}",
            "user": "{{ ssh_user }}",
            "port": "{{ ssh_port }}",
            "identity_file": "{{ final_ssh_key_path }}",
            "volumes": "{{ item.value.platform.volumes | default({}) }}",
            "networks": "{{ item.value.platform.networks | default({}) | dict2items(key_name='name', value_name='data') }}",
          }
      loop: "{{ created_servers | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: instance_config_dict

    - name: Convert instance config dict to a list
      ansible.builtin.set_fact:
        instance_conf: "{{ instance_config_dict.results | map(attribute='ansible_facts.instance_conf_dict') | list }}"

    - name: Dump instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed

          {{ instance_conf | to_json | from_json | to_yaml }}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"

    - name: Dump instance config
      ansible.builtin.debug:
        msg: "content of instance config: {{ lookup('file', molecule_instance_config) | from_yaml }}"

    - name: Wait for SSH port to become available
      ansible.builtin.wait_for:
        host: "{{ item.address }}"
        port: "{{ item.port }}"
        search_regex: OpenSSH
        delay: 5
        timeout: 90
      loop: "{{ lookup('file', molecule_instance_config) | from_yaml }}"
      loop_control:
        label: "{{ item.instance }}"
      retries: 3
      delay: 10

    - name: Test SSH connection
      ansible.builtin.shell: >
        ssh -o ConnectTimeout=10
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
        -o BatchMode=yes
        -i {{ item.identity_file }}
        {{ item.user }}@{{ item.address }} whoami
      loop: "{{ lookup('file', molecule_instance_config) | from_yaml }}"
      loop_control:
        label: "{{ item.instance }}"
      register: ssh_test
      retries: 30
      delay: 10
      until: ssh_test.rc == 0
      changed_when: false
