---
# One pid file of the work directory; the guest need not be in the instance config,
# so guests of a create that failed half way are stopped too.
- name: Read the pid
  ansible.builtin.slurp:
    src: "{{ guest_pidfile_path }}"
  register: guest_pid

# SIGTERM, up to 30 s for a clean exit, then SIGKILL. The daemonized QEMU is
# reparented to the container's PID 1 (sleep in CI), which does not reap it,
# so a zombie counts as gone; a guest that already exited is fine as well.
# The pid may have been reused since: only a qemu process whose command line carries
# this pid file name is killed (a zombie has an empty command line).
- name: Terminate QEMU
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        pid=$1
        pidfile=$2
        name=${pidfile##*/}
        is_ours() {
          tr '\0' '\n' 2>/dev/null < "/proc/$pid/cmdline" | awk -v n="/$name" '
            NR == 1 && $0 !~ /qemu/ { exit 1 }
            substr($0, length($0) - length(n) + 1) == n { found = 1 }
            END { exit !found }'
        }
        [ -n "$pid" ] || exit 0
        is_ours || exit 0
        kill "$pid" 2>/dev/null || exit 0
        for _ in $(seq 1 30); do
          is_ours || exit 0
          sleep 1
        done
        kill -9 "$pid" 2>/dev/null
        exit 0
      - sh
      - "{{ guest_pid.content | b64decode | trim }}"
      - "{{ guest_pidfile_path }}"
  changed_when: true
