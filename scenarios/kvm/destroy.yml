---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log }}"
  vars:
    kvm_work_dir: "{{ lookup('ansible.builtin.env', 'KVM_WORK_DIR') | default(molecule_ephemeral_directory + '/kvm', true) }}"
  tasks:
    # Every pid file, not the instance config: that is written only after all guests
    # started, so a failed create leaves running guests it does not list
    - name: Find the pid files
      ansible.builtin.find:
        paths: "{{ kvm_work_dir }}"
        patterns: "*.pid"
      register: kvm_pidfiles

    - name: Stop the guests
      ansible.builtin.include_tasks: destroy_guest.yml
      loop: "{{ kvm_pidfiles.files | map(attribute='path') | list }}"
      loop_control:
        loop_var: guest_pidfile_path
        label: "{{ guest_pidfile_path | basename }}"

    - name: Remove the work directory
      ansible.builtin.file:
        path: "{{ kvm_work_dir }}"
        state: absent

    - name: Dump instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed

          {{ {} | to_yaml }}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
