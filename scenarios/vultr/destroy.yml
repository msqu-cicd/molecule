---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log }}"
  tasks:
    - name: Set hetzner facts
      ansible.builtin.set_fact:
        vultr_server_state: "{{ lookup('ansible.builtin.env', 'VULTR_SERVER_STATE') or 'absent' }}"

    - name: Populate the instance config
      ansible.builtin.set_fact:
        instance_conf: "{{ lookup('file', molecule_instance_config, errors='warn') | from_yaml }}"
        skip_instances: false
      register: instance_config_lookup

    - name: Populate instance config when file missing
      ansible.builtin.set_fact:
        instance_conf: {}
        skip_instances: true
      when: not instance_config_lookup.ansible_facts.instance_conf

    - name: Destroy Vultr Server
      block:
        - name: Destroy molecule instance(s)
          vultr.cloud.instance:
            label: "{{ item.name }}"
            region: "{{ item.region }}"
            api_key: "{{ lookup('env', 'VULTR_API_KEY') }}"
            state: absent
          register: server_destroy
          with_items: "{{ molecule_yml.platforms }}"
      when: vultr_server_state == 'absent'

    # present is no power state: running servers stay as they are (the module would need a plan)
    - name: Stop Vultr Server
      when:
        - vultr_server_state != 'absent'
        - vultr_server_state != 'present'
      block:
        - name: Gather Vultr servers information
          vultr.cloud.instance_info:
            label: "{{ item.name }}"
            region: "{{ item.region }}"
            api_key: "{{ lookup('env', 'VULTR_API_KEY') }}"
          loop: "{{ molecule_yml.platforms }}"
          loop_control:
            label: "{{ item.name }}"
          register: vultr_server_info_output

        - name: "Trigger molecule instance(s) desired state {{ vultr_server_state }}"
          vultr.cloud.instance:
            label: "{{ item.item.name }}"
            region: "{{ item.item.region }}"
            api_key: "{{ lookup('env', 'VULTR_API_KEY') }}"
            state: "{{ vultr_server_state }}"
          register: server_stop
          loop: "{{ vultr_server_info_output.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          # existing servers only: the module would try to create a missing one
          when: item.vultr_instance_info | selectattr('label', 'equalto', item.item.name) | list | length > 0

    - name: Remove registered SSH key
      vultr.cloud.ssh_key:
        name: "{{ instance_conf[0].ssh_key_name }}"
        api_key: "{{ lookup('env', 'VULTR_API_KEY') }}"
        state: absent
      when:
        - not skip_instances
        - instance_conf | length > 0  # must contain at least one instance
        - instance_conf[0].ssh_key_name is ansible.builtin.match('molecule-generated-')

    - name: Populate instance config
      ansible.builtin.set_fact:
        instance_conf: {}

    - name: Dump instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed

          {{ instance_conf | to_json | from_json | to_yaml }}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
      # separate registers: a skipped task would overwrite the result of the other one
      when: server_destroy is changed or server_stop is changed
