---
# Optional molecule/default/converge_override.yml of a role: the scenario's converge.yml includes it
# with include_tasks after its own pre_tasks (apt cache, facts) and before the role, so it is a flat
# task list, not a playbook. Example: a prerequisite role (from requirements.yml), skipped in the
# idempotence run.
- name: Include the example prerequisite role
  ansible.builtin.include_role:
    name: example
  when: "'molecule-idempotence-notest' not in ansible_skip_tags"
